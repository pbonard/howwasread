name: offlineconversation
on:
  push:
    branches:
      - main
    paths:
      - 'backend/offlineconversation/**'
      - '.github/workflows/offlineconversation.yml'
      - '.github/workflows/build-and-deploy.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      image: backend/offlineconversation
      dockerfile: ./backend/offlineconversation/Dockerfile
      context: ./backend/offlineconversation
