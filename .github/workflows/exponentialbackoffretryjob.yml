name: exponentialbackoffretryjob
on:
  push:
    branches:
      - main
    paths:
      - 'backend/exponentialbackoffretryjob/**'
      - '.github/workflows/exponentialbackoffretryjob.yml'
      - '.github/workflows/build-and-deploy.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      image: flink/exponentialbackoffretryjob
      dockerfile: ./backend/exponentialbackoffretryjob/Dockerfile
      context: ./backend/exponentialbackoffretryjob
