name: conversationcdcjob
on:
  push:
    branches:
      - main
    paths:
      - 'backend/conversationcdcjob/**'
      - '.github/workflows/conversationcdcjob.yml'
      - '.github/workflows/build-and-deploy.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      image: flink/conversationcdcjob
      dockerfile: ./backend/conversationcdcjob/Dockerfile
      context: ./backend/conversationcdcjob
