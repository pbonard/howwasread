name: onlineconversation
on:
  push:
    branches:
      - main
    paths:
      - 'backend/onlineconversation/**'
      - 'backend/common/**'
      - '.github/workflows/onlineconversation.yml'
      - '.github/workflows/build-and-deploy.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      image: backend/onlineconversation
      dockerfile: ./backend/onlineconversation/Dockerfile
      context: ./backend
