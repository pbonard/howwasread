name: signalrelay
on:
  push:
    branches:
      - main
    paths:
      - 'backend/signalrelay/**'
      - 'backend/common/**'
      - '.github/workflows/signalrelay.yml'
      - '.github/workflows/build-and-deploy.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      image: backend/signalrelay
      dockerfile: ./backend/signalrelay/Dockerfile
      context: ./backend
