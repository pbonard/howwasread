name: services
on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changed.outputs.services }}
    steps:
      - name: checkout github
        uses: actions/checkout@v6
        with:
          # the previous commit of the push is needed to list the changed files
          fetch-depth: 0

      # a broken pipeline script fails the run before anything is built or deployed
      - name: test the pipeline scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: find the changed services
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 .github/scripts/changed_services.py

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      # every build runs to the end, so one run shows all broken services at once
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    name: build ${{ matrix.service.name }}
    steps:
      - name: checkout github
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: build and push ${{ matrix.service.image }}
        env:
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image }}
        run: |
          IMAGE=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          # :latest is kept until nothing pulls it anymore
          docker buildx build --platform linux/amd64 \
            -t "$IMAGE:${GITHUB_SHA::7}" \
            -t "$IMAGE:latest" \
            -f ${{ matrix.service.dockerfile }} ${{ matrix.service.context }} --push

  deploy:
    needs: [changes, build]
    # all or nothing: runs only when every build of this push succeeded
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: checkout github
        uses: actions/checkout@v6
        with:
          # fetch full git history to compare this push's commit with the ones in values.yaml
          fetch-depth: 0

      - name: write the tags into helm values
        env:
          HELM_VALUES_PATH: infra/k8s/helm/values.yaml
          SERVICES: ${{ needs.changes.outputs.services }}
        run: python3 .github/scripts/deploy_tags.py
