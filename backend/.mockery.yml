# go tool mockery (run from backend/) generates testify mocks.
# - common interfaces go to common/mocks (package mocks), shared by every service's tests
# - a service's own interfaces go to <service>/test as _test.go files
template: testify
filename: "mock_{{.InterfaceName | snakecase}}_test.go"
structname: "Mock{{.InterfaceName}}"
packages:
  backend/common:
    interfaces:
      Producer:
        config:
          dir: common/mocks
          pkgname: mocks
          filename: mock_producer.go
      CDNClient:
        config:
          dir: common/mocks
          pkgname: mocks
          filename: mock_cdn_client.go
  backend/chat/internal/client:
    interfaces:
      StorageClient:
        configs:
          - dir: chat/test
            pkgname: test
  backend/messagepreprocess/internal/repository:
    interfaces:
      Repository:
        configs:
          - dir: messagepreprocess/test
            pkgname: test
  backend/messagepersist/internal/repository:
    interfaces:
      Repository:
        configs:
          - dir: messagepersist/test
            pkgname: test
  backend/onlineconversation/internal/repository:
    interfaces:
      Repository:
        configs:
          - dir: onlineconversation/test
            pkgname: test
      Tx:
        configs:
          - dir: onlineconversation/test
            pkgname: test
  backend/notification/internal/repository:
    interfaces:
      Repository:
        configs:
          - dir: notification/test
            pkgname: test
  backend/notification/internal/service:
    interfaces:
      Service:
        configs:
          - dir: notification/test
            pkgname: test
  backend/chat/internal/repository:
    interfaces:
      Repository:
        configs:
          - dir: chat/test
            pkgname: test
  backend/chat/internal/service:
    interfaces:
      Service:
        configs:
          - dir: chat/test
            pkgname: test
  backend/fcmnotification/internal/repository:
    interfaces:
      Repository:
        configs:
          - dir: fcmnotification/test
            pkgname: test
  backend/messagerelay/internal/repository:
    interfaces:
      Repository:
        configs:
          - dir: messagerelay/test
            pkgname: test
  backend/signalrelay/internal/repository:
    interfaces:
      Repository:
        configs:
          - dir: signalrelay/test
            pkgname: test
  backend/auth/internal/repository:
    interfaces:
      Repository:
        configs:
          - dir: auth/test
            pkgname: test
  backend/auth/internal/service:
    interfaces:
      Service:
        configs:
          - dir: auth/test
            pkgname: test
  backend/onlineconversation/internal/service:
    interfaces:
      Service:
        configs:
          - dir: onlineconversation/test
            pkgname: test
  backend/fcmnotification/internal/client:
    interfaces:
      FCMClient:
        configs:
          - dir: fcmnotification/test
            pkgname: test
  backend/messagerelay/internal/client:
    interfaces:
      RelayClient:
        configs:
          - dir: messagerelay/test
            pkgname: test
  backend/signalrelay/internal/client:
    interfaces:
      RelayClient:
        configs:
          - dir: signalrelay/test
            pkgname: test
  backend/auth/internal/client:
    interfaces:
      SMSClient:
        configs:
          - dir: auth/test
            pkgname: test
      GoogleAuthClient:
        configs:
          - dir: auth/test
            pkgname: test
      SMTPClient:
        configs:
          - dir: auth/test
            pkgname: test
