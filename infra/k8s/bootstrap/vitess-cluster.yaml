apiVersion: planetscale.com/v2
kind: VitessCluster
metadata:
  name: vitess-cluster
  namespace: vitess
spec:
  updateStrategy:
    type: Immediate # reflect apply -f declaratively
  globalLockserver:
    etcd: {}
  cells:
    - name: zone1
      lockserver:
        etcd: {}
      gateway:
        replicas: 1
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            memory: 512Mi
        authentication:
          static:
            secret:
              name: vitess-users
              key: users.json
  keyspaces:
    - name: conversation
      durabilityPolicy: none # single tablet set up
      partitionings:
        - equal:
            parts: 1
            shardTemplate:
              databaseInitScriptSecret:
                name: vitess-init-script
                key: init_db.sql
              tabletPools:
                - cell: zone1
                  type: replica
                  replicas: 1
                  vttablet:
                    resources:
                      requests:
                        cpu: 500m
                        memory: 256Mi
                      limits:
                        memory: 512Mi
                  mysqld:
                    resources:
                      requests:
                        cpu: 500m
                        memory: 512Mi
                      limits:
                        memory: 1Gi
                  dataVolumeClaimTemplate:
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: 5Gi
#                - cell: zone1
#                  type: rdonly
#                  replicas: 1
---
apiVersion: v1
kind: Secret
metadata:
  name: vitess-init-script
  namespace: vitess
type: Opaque
stringData:
  init_db.sql: |
    -- This script runs on each new mysqld instance to bootstrap the
    -- users and internal tables that Vitess itself relies on.
    SET @original_super_read_only=IF(@@global.super_read_only=1, 'ON', 'OFF');
    SET GLOBAL super_read_only='OFF';
    SET sql_log_bin = 0;

    CREATE DATABASE IF NOT EXISTS _vt;
    CREATE TABLE IF NOT EXISTS _vt.local_metadata (
      name VARCHAR(255) NOT NULL,
      value VARCHAR(255) NOT NULL,
      db_name VARBINARY(255) NOT NULL,
      PRIMARY KEY (db_name, name)
    ) ENGINE=InnoDB;
    CREATE TABLE IF NOT EXISTS _vt.shard_metadata (
      name VARCHAR(255) NOT NULL,
      value MEDIUMBLOB NOT NULL,
      db_name VARBINARY(255) NOT NULL,
      PRIMARY KEY (db_name, name)
    ) ENGINE=InnoDB;

    CREATE USER IF NOT EXISTS 'vt_dba'@'localhost';
    GRANT ALL ON *.* TO 'vt_dba'@'localhost' WITH GRANT OPTION;

    CREATE USER IF NOT EXISTS 'vt_app'@'localhost';
    GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, RELOAD, PROCESS, FILE,
      REFERENCES, INDEX, ALTER, SHOW DATABASES, CREATE TEMPORARY TABLES,
      LOCK TABLES, EXECUTE, REPLICATION CLIENT, CREATE VIEW,
      SHOW VIEW, CREATE ROUTINE, ALTER ROUTINE, CREATE USER, EVENT, TRIGGER
      ON *.* TO 'vt_app'@'localhost';

    CREATE USER IF NOT EXISTS 'vt_appdebug'@'localhost';
    GRANT SELECT, SHOW DATABASES, PROCESS ON *.* TO 'vt_appdebug'@'localhost';

    CREATE USER IF NOT EXISTS 'vt_allprivs'@'localhost';
    GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, RELOAD, PROCESS, FILE,
      REFERENCES, INDEX, ALTER, SHOW DATABASES, CREATE TEMPORARY TABLES,
      LOCK TABLES, EXECUTE, REPLICATION SLAVE, REPLICATION CLIENT, CREATE VIEW,
      SHOW VIEW, CREATE ROUTINE, ALTER ROUTINE, CREATE USER, EVENT, TRIGGER
      ON *.* TO 'vt_allprivs'@'localhost';

    CREATE USER IF NOT EXISTS 'vt_repl'@'%';
    GRANT REPLICATION SLAVE ON *.* TO 'vt_repl'@'%';

    CREATE USER IF NOT EXISTS 'vt_filtered'@'localhost';
    GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, RELOAD, PROCESS, FILE,
      REFERENCES, INDEX, ALTER, SHOW DATABASES, CREATE TEMPORARY TABLES,
      LOCK TABLES, EXECUTE, REPLICATION SLAVE, REPLICATION CLIENT, CREATE VIEW,
      SHOW VIEW, CREATE ROUTINE, ALTER ROUTINE, CREATE USER, EVENT, TRIGGER
      ON *.* TO 'vt_filtered'@'localhost';

    CREATE DATABASE IF NOT EXISTS conversation;

    FLUSH PRIVILEGES;
    RESET SLAVE ALL;
    RESET MASTER;
    SET GLOBAL super_read_only=IFNULL(@original_super_read_only, 'ON');