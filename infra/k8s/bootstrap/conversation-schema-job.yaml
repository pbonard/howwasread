apiVersion: v1
kind: ConfigMap
metadata:
  name: conversation-schema
  namespace: vitess
data:
  create_tables.sql: |
    -- ============================================================
    -- Offline conversation tables (Java / Hibernate entities)
    -- ============================================================

    CREATE TABLE offline_conversation
    (
        id             BINARY(16)   NOT NULL,
        novel          TEXT,
        poem           TEXT,
        short_story    TEXT,
        play           TEXT,
        film           TEXT,
        written_by     TEXT        NOT NULL,
        rule           TEXT,
        time           DATETIME    NOT NULL,
        length_minutes INT         NOT NULL,
        maps_link      TEXT        NOT NULL,
        location       TEXT,
        latitude DOUBLE NOT NULL,
        longitude DOUBLE NOT NULL,
        city           TEXT,
        h3_res5        VARCHAR(15) NOT NULL,
        h3_res7        VARCHAR(15) NOT NULL,
        updated_at     DATETIME NULL,
        PRIMARY KEY (id)
    );

    CREATE TABLE offline_conversation_moderator
    (
        conversation_id BINARY(16) NOT NULL,
        member_id       BINARY(16) NOT NULL,
        PRIMARY KEY (conversation_id, member_id)
    );

    CREATE TABLE offline_conversation_participant
    (
        conversation_id BINARY(16) NOT NULL,
        member_id       BINARY(16) NOT NULL,
        PRIMARY KEY (conversation_id, member_id)
    );

    -- ============================================================
    -- Online conversation tables (Go repository)
    -- ============================================================

    CREATE TABLE online_conversation
    (
        id                  BINARY(16)   NOT NULL,
        novel               TEXT,
        short_story         TEXT,
        poem                TEXT,
        play                TEXT,
        film                TEXT,
        written_by          TEXT     NOT NULL,
        rule                TEXT,
        capacity            INT      NOT NULL,
        time                DATETIME NOT NULL,
        length_minutes      INT      NOT NULL,
        current_registrants INT      NOT NULL DEFAULT 0,
        updated_at          DATETIME(6) NULL,
        is_evaluated        BOOLEAN  NOT NULL DEFAULT FALSE,
        PRIMARY KEY (id)
    );

    CREATE TABLE online_conversation_moderator
    (
        conversation_id BINARY(16) NOT NULL,
        member_id       BINARY(16) NOT NULL,
        PRIMARY KEY (conversation_id, member_id)
    );

    CREATE TABLE online_conversation_registrant
    (
        conversation_id BINARY(16) NOT NULL,
        member_id       BINARY(16) NOT NULL,
        PRIMARY KEY (conversation_id, member_id)
    );

    CREATE TABLE online_conversation_ban
    (
        conversation_id BINARY(16) NOT NULL,
        member_id       BINARY(16) NOT NULL,
        PRIMARY KEY (conversation_id, member_id)
    );

    CREATE TABLE online_conversation_notification
    (
        conversation_id BINARY(16) NOT NULL,
        member_id       BINARY(16) NOT NULL,
        PRIMARY KEY (conversation_id, member_id)
    );

    -- ============================================================
    -- Transactional outbox, rows are inserted and deleted in the same transaction.
    -- The CDC job forwards the inserts from the binlog to the Kafka topic in the topic column,
    -- so the table stays empty.
    -- ============================================================

    CREATE TABLE outbox
    (
        id              BINARY(16)   NOT NULL,
        conversation_id BINARY(16)   NOT NULL,
        topic           VARCHAR(255) NOT NULL,
        -- sent as the "taskType" kafka header, NULL sends no header
        task_type       VARCHAR(64)  NULL,
        payload         TEXT         NOT NULL,
        PRIMARY KEY (id)
    );

  vschema.json: |
    {
      "sharded": true,
      "vindexes": {
        "binary_md5": {
          "type": "binary_md5"
        }
      },
      "tables": {
        "online_conversation": {
          "column_vindexes": [
            {
              "column": "id",
              "name": "binary_md5"}
          ]
        },
        "online_conversation_moderator": {
          "column_vindexes": [
            {
              "column": "conversation_id",
              "name": "binary_md5"}
          ]
        },
        "online_conversation_registrant": {
          "column_vindexes": [
            {
              "column": "conversation_id",
              "name": "binary_md5"}
          ]
        },
        "online_conversation_ban": {
          "column_vindexes": [
            {
              "column": "conversation_id",
              "name": "binary_md5"}
          ]
        },
        "online_conversation_notification": {
          "column_vindexes": [
            {
              "column": "conversation_id",
              "name": "binary_md5"}
          ]
        },
        "offline_conversation": {
          "column_vindexes": [
            {
              "column": "id",
              "name": "binary_md5"}
          ]
        },
        "offline_conversation_moderator": {
          "column_vindexes": [
            {
              "column": "conversation_id",
              "name": "binary_md5"}
          ]
        },
        "offline_conversation_participant": {
          "column_vindexes": [
            {
              "column": "conversation_id",
              "name": "binary_md5"}
          ]
        },
        "outbox": {
          "column_vindexes": [
            {
              "column": "conversation_id",
              "name": "binary_md5"}
          ]
        }
      }
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: conversation-schema-job
  namespace: vitess
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: vtctldclient
          image: vitess/lite:v24.0.3-mysql80
          command:
            - sh
            - -c
            - |
              set -eu
              VTCTLD_SERVER="vitess-cluster-vtctld-e819f254.vitess.svc.cluster.local:15999"

              # Declarative: the CREATE TABLE statements are the desired end state.
              # Missing tables are created, existing ones are ALTERed to match,
              # unchanged ones become no-op migrations. Runs asynchronously as Online DDL.
              echo "Submitting declarative schema migrations for keyspace 'conversation'..."
              vtctldclient --server "$VTCTLD_SERVER" \
                ApplySchema --ddl-strategy "vitess --declarative" \
                --sql-file=/schema/create_tables.sql conversation

              echo "Applying VSchema to keyspace 'conversation'..."
              vtctldclient --server "$VTCTLD_SERVER" \
                ApplyVSchema --vschema-file=/schema/vschema.json conversation

              echo "Done."
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: conversation-schema