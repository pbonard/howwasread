#          - name: argocd-pbonard-tls
#      allowedRoutes:
#        namespaces:
#          from: All
---

apiVersion: v1
kind: Service
metadata:
  name: static-envoy-ingress
  namespace: envoy-gateway-system
spec:
  type: ClusterIP
  selector:
    # These labels strictly target your Envoy proxy pods
    gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
    gateway.envoyproxy.io/owning-gateway-name: cluster-gateway
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 10080