# Argo CD keeps the sealed secrets at what infra/k8s/sealedsecret on main says: a re-sealed secret is applied
# once it's pushed, and argo cd's health check shows a sealed secret the controller can't decrypt.
# The files carry their own namespaces.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pbonard/howwasread.git
    targetRevision: main
    path: infra/k8s/sealedsecret
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: false
      # a file removed from git leaves its secret in the cluster, deleting a secret is done on purpose by hand
      prune: false
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
