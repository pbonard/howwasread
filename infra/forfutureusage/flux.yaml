apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: howwasread
  namespace: flux-system
spec:
  url: https://github.com/pbonard/howwasread.git
  ref:
    branch: main
  interval: 10m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: holiday
  namespace: flux-system
spec:
  # same name and namespace as the release installed by hand, so flux upgrades it instead of installing a second one
  releaseName: holiday
  targetNamespace: backend
  storageNamespace: backend
  interval: 10m
  chart:
    spec:
      chart: ./infra/k8s/helm
      sourceRef:
        kind: GitRepository
        name: howwasread
      # the chart version in Chart.yaml never changes, every commit is a new chart so a changed values.yaml is deployed
      reconcileStrategy: Revision
  install:
    remediation:
      retries: 3
  # a failed upgrade is rolled back to the last working release and tried again
  upgrade:
    remediation:
      retries: 3
