{{- range $name, $app := .Values.apps }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
spec:
  # replicas: 1
  {{- if $app.turn }}
  # host ports can't be held by the old and the new pod at once, so the old pod stops before the new one starts
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        framework: {{ $app.framework | default "none" }}
    spec:
      {{- if $app.turn }}
      hostNetwork: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - {{ $name }}
              topologyKey: "kubernetes.io/hostname"
      {{- end }}
      {{- if hasPrefix "ghcr.io/" $.Values.registry }}
      imagePullSecrets:
        - name: ghcr
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.registry }}/{{ $app.image }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ $app.port }}
{{/*          resources:*/}}
{{/*            requests:*/}}
{{/*              cpu: {{ $app.cpuRequests }}*/}}
{{/*              memory: {{ $app.memoryRequests }}*/}}
{{/*            limits:*/}}
{{/*              cpu: {{ $app.cpuLimits }}*/}}
{{/*              memory: {{ $app.memoryLimits }}*/}}
          env:
            {{- if $app.valkey }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-user
                  key: lule
            {{- end}}
            {{- if $app.k8ssandra }}
            - name: K8SSANDRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: k8ssandra-cluster-superuser
                  key: username
            - name: K8SSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8ssandra-cluster-superuser
                  key: password
            {{- end }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - configMapRef:
                name: config-map
            {{- if $app.turn }}
            - secretRef:
                name: cloudflaredns
            {{- end }}
            {{- if $app.aws }}
            - secretRef:
                name: aws
            {{- end }}
            {{- if $app.mysql }}
            - secretRef:
                name: mysql
            {{- end }}
            {{- if $app.smtp }}
            - secretRef:
                name: smtp
            {{- end }}
            {{- if $app.twilio }}
            - secretRef:
                name: twilio
            {{- end }}
            {{- if $app.opensearch }}
            - secretRef:
                name: opensearch
            {{- end }}
          volumeMounts:
            {{- if $app.authentication}}
            - name: authentication-volume
              mountPath: "/cert/authentication"
              readOnly: true
            {{- end}}
            {{- if $app.k8ssandra }}
            - name: internal-root-ca-bundle
              mountPath: "/cert/k8ssandra"
              readOnly: true
            {{- end }}
            {{- if $app.aws }}
            - name: aws-volume
              mountPath: "/cert/aws"
              readOnly: true
            {{- end }}
            {{- if $app.firebase }}
            - name: firebase-volume
              mountPath: "/cert/firebase"
              readOnly: true
            {{- end }}
            {{- if $app.mongodb }}
            - name: mongodb-volume
              mountPath: "/cert/mongodb"
              readOnly: true
            {{- end }}
            {{- if $app.kafka }}
            - name: kafka-user
              mountPath: "/cert/kafka/user"
              readOnly: true
            - name: kafka-ca
              mountPath: "/cert/kafka/cluster"
              readOnly: true
            {{- end }}
            {{- if $app.valkey }}
            - name: valkey-cert-volume
              mountPath: "/cert/valkey"
              readOnly: true
            {{- end }}
            {{- if $app.turn }}
            - name: turn-cert-volume
              mountPath: "/cert/turn"
              readOnly: true
            {{- end }}
      volumes:
        {{- if $app.k8ssandra }}
        - name: internal-root-ca-bundle
          configMap:
            name: internal-root-ca-bundle
        {{- end }}
        {{- if $app.turn }}
        - name: turn-cert-volume
          secret:
            secretName: turn-tls-cert
        {{- end }}
        {{- if $app.authentication}}
        - name: authentication-volume
          secret:
            secretName: authentication-volume
        {{- end}}
        {{- if $app.aws }}
        - name: aws-volume
          secret:
            secretName: aws-volume
        {{- end }}
        {{- if $app.firebase }}
        - name: firebase-volume
          secret:
            secretName: firebase-volume
        {{- end }}
        {{- if $app.mongodb }}
        - name: mongodb-volume
          secret:
            secretName: mongodb-volume
        {{- end }}
        {{- if $app.kafka }}
        - name: kafka-user
          secret:
            secretName: kafka-user
        - name: kafka-ca
          secret:
            secretName: kafka-cluster-cluster-ca-cert
        {{- end }}
        {{- if $app.valkey }}
        - name: valkey-cert-volume
          secret:
            secretName: valkey-cert
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}

{{- if not $app.turn }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: {{ $app.port }}
{{- end }}

